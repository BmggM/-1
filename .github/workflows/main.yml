name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project and Build APK
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE" -name settings.gradle -type f | head -n 1)")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd
          ls -la

          gradle assembleDebug

      - name: Find APK
        run: |
          echo "Generated APK:"
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DdayCalendar-3.1
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
